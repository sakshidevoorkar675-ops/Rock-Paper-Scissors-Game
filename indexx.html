<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="styleee.css">
    
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://tse2.mm.bing.net/th/id/OIP.lRZGoLZt1B4c9E4roOnVNQHaIr?r=0&pid=Api&h=220&P=0">
        </div>
        <div class="choice" id="paper">
            <img src="https://tse4.mm.bing.net/th/id/OIP.1IG_LTuqxsw6BqEJrKEkyAHaHi?r=0&pid=Api&h=220&P=0">
        </div>
        <div class="choice" id="scissors">
            <img src="https://tse1.mm.bing.net/th/id/OIP.d-BfrmBnAbthd_h-QMpmpgHaFN?r=0&pid=Api&h=220&P=0">
        </div>
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="Comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>


    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
</body>
<script src="scripttt.js"></script>
</html>
